<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Xie Xe Hat</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: #FFFFFF;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 36px;
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <!-- Brand -->
            <div style="text-align: center; margin-bottom: 28px;">
                <div style="width: 48px; height: 48px; background: var(--primary); border-radius: 12px; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; color: white;">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
                    </svg>
                </div>
                <h1 style="font-size: 22px; font-weight: 800; color: var(--text-heading); margin-bottom: 6px;">Masuk ke Xie Xe Hat</h1>
                <p style="font-size: 13px; color: var(--text-muted);">Platform Analitik Kesehatan Organisasi UMKM</p>
            </div>

            <!-- Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Username atau Email</label>
                    <input type="text" id="email" class="form-control" placeholder="owner@tokosehat.id" value="owner@tokosehat.id" required>
                </div>

                <div class="form-group">
                    <label for="password">Kata Sandi</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" value="password123" required>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; margin-bottom: 22px;">
                    <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-body);">
                        <input type="checkbox" checked style="accent-color: var(--primary);"> Ingat saya
                    </label>
                    <a href="#" style="color: var(--primary); font-weight: 600;">Lupa kata sandi?</a>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 15px;">
                    Masuk ke Dashboard
                </button>
            </form>

            <div style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-muted);">
                Belum memiliki akun? <a href="register.html" style="color: var(--primary); font-weight: 700;">Daftar Akun Baru</a>
            </div>

            <div style="text-align: center; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border-subtle); font-size: 12px;">
                <a href="index.html" style="color: var(--text-muted);">← Kembali ke Halaman Utama</a>
            </div>

        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
