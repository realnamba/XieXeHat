<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - Xie Xe Hat</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        .auth-card {
            width: 100%;
            max-width: 460px;
            background: #FFFFFF;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 36px;
        }
        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .role-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 14px;
            border: 1px solid var(--border-hover);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .role-option input[type="radio"] {
            accent-color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <div style="text-align: center; margin-bottom: 26px;">
                <div style="width: 44px; height: 44px; background: var(--primary); border-radius: 12px; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; color: white;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
                    </svg>
                </div>
                <h1 style="font-size: 22px; font-weight: 800; color: var(--text-heading); margin-bottom: 4px;">Daftar Akun Baru</h1>
                <p style="font-size: 13px; color: var(--text-muted);">Mulai perjalanan organisasi UMKM yang sehat</p>
            </div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="name">Nama Lengkap</label>
                    <input type="text" id="name" class="form-control" placeholder="Contoh: Budi Santoso" required>
                </div>

                <div class="form-group">
                    <label for="umkm">Nama Usaha / UMKM</label>
                    <input type="text" id="umkm" class="form-control" placeholder="Contoh: Kopi Kenangan Sehat" required>
                </div>

                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <input type="email" id="email" class="form-control" placeholder="nama@email.com" required>
                </div>

                <div class="form-group">
                    <label>Peran dalam Usaha</label>
                    <div class="role-selector">
                        <label class="role-option">
                            <input type="radio" name="role" value="owner" checked>
                            <span>Pemilik / Owner</span>
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="employee">
                            <span>Karyawan</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Kata Sandi</label>
                    <input type="password" id="password" class="form-control" placeholder="Minimal 8 karakter" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 15px; margin-top: 8px;">
                    Daftar & Masuk
                </button>
            </form>

            <div style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-muted);">
                Sudah memiliki akun? <a href="login.html" style="color: var(--primary); font-weight: 700;">Masuk di Sini</a>
            </div>

            <div style="text-align: center; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border-subtle); font-size: 12px;">
                <a href="index.html" style="color: var(--text-muted);">← Kembali ke Halaman Utama</a>
            </div>

        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
